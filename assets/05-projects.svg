<rect x="60" y="278" width="300" height="2" fill="#22D3EE" opacity=".35"/>
<text x="60" y="310" font-size="12" fill="#A7B4CC">Built with practical engineering &amp; problem-solving focus.</text>
</g><g class="in" style="animation-delay:0.15s">
<rect x="410" y="95" width="350" height="245" rx="22" fill="#071A30" stroke="#A78BFA" stroke-opacity=".6"/>
<rect x="430" y="115" width="310" height="46" rx="14" fill="#A78BFA" fill-opacity=".09"/>
<text x="445" y="144" font-size="17" font-weight="900" fill="#F8FAFC">🔐 OTP Authentication Service</text>
<text x="435" y="190" font-size="13" fill="#A7B4CC">Authentication service centered on OTP verification and secure user access workflows.</text>
<text x="435" y="215" font-size="13" fill="#F8FAFC">Project status:</text>
