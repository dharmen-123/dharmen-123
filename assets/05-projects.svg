<rect x="435" y="278" width="300" height="2" fill="#A78BFA" opacity=".35"/>
<text x="435" y="310" font-size="12" fill="#A7B4CC">Built with practical engineering &amp; problem-solving focus.</text>
</g><g class="in" style="animation-delay:0.30s">
<rect x="785" y="95" width="350" height="245" rx="22" fill="#071A30" stroke="#34D399" stroke-opacity=".6"/>
<rect x="805" y="115" width="310" height="46" rx="14" fill="#34D399" fill-opacity=".09"/>
<text x="820" y="144" font-size="17" font-weight="900" fill="#F8FAFC">📄 Document QnA Bot</text>
<text x="810" y="190" font-size="13" fill="#A7B4CC">AI-powered document question-answering application using NLP and LLM-based techniques.</text>
<text x="810" y="215" font-size="13" fill="#F8FAFC">Project status:</text>
<text x="810" y="238" font-size="13" fill="#34D399">GitHub repository</text>
<rect x="810" y="278" width="300" height="2" fill="#34D399" opacity=".35"/>
<text x="810" y="310" font-size="12" fill="#A7B4CC">Built with practical engineering &amp; problem-solving focus.</text>
</g>
</g>
</svg>