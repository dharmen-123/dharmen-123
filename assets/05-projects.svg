<rect x="55" y="115" width="310" height="46" rx="14" fill="#22D3EE" fill-opacity=".09"/>
<text x="70" y="144" font-size="17" font-weight="900" fill="#F8FAFC">✈️ Tours &amp; Trip – Travel Website</text>
