<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="620" viewBox="0 0 1600 620"
     role="img" aria-labelledby="title desc">

  <title id="title">Dharmendra Chilhate - AI/ML Engineer | Full Stack Developer</title>
  <desc id="desc">Animated GitHub profile hero section.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="48%" stop-color="#07111F"/>
      <stop offset="75%" stop-color="#0B2140"/>
      <stop offset="100%" stop-color="#11183A"/>
    </linearGradient>

    <radialGradient id="glow" cx="72%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".32"/>
      <stop offset="35%" stop-color="#6366F1" stop-opacity=".20"/>
      <stop offset="65%" stop-color="#7C3AED" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A2E" stop-opacity=".96"/>
      <stop offset="100%" stop-color="#111A3C" stop-opacity=".92"/>
    </linearGradient>

    <radialGradient id="photoGlow">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#38BDF8" stroke-opacity=".07"/>
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="photoClip">
      <circle cx="805" cy="340" r="190"/>
    </clipPath>

    <style>
      .fade { opacity:0; animation:fade 1.1s ease forwards; }
      .d1 { animation-delay:.2s; }
      .d2 { animation-delay:.45s; }
      .d3 { animation-delay:.7s; }
      .d4 { animation-delay:.95s; }
      .float { animation:float 5s ease-in-out infinite; }
      .pulse { animation:pulse 2s ease-in-out infinite; }
      .spin { transform-origin:805px 340px; animation:spin 18s linear infinite; }
      .spin2 { transform-origin:805px 340px; animation:spin2 25s linear infinite; }
      .scan { animation:scan 4s ease-in-out infinite; }
      .p1 { animation:p1 5s ease-in-out infinite; }
      .p2 { animation:p2 6s ease-in-out infinite; }
      .p3 { animation:p3 7s ease-in-out infinite; }

      @keyframes fade {
        from { opacity:0; transform:translateY(14px); }
        to { opacity:1; transform:translateY(0); }
      }
      @keyframes float {
        0%,100% { transform:translateY(0); }
        50% { transform:translateY(-10px); }
      }
      @keyframes pulse {
        0%,100% { opacity:.45; transform:scale(1); }
        50% { opacity:1; transform:scale(1.15); }
      }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes spin2 { to { transform:rotate(-360deg); } }
      @keyframes scan {
        0% { transform:translateY(-30px); opacity:0; }
        25% { opacity:.7; }
        70% { opacity:.3; }
        100% { transform:translateY(560px); opacity:0; }
      }
      @keyframes p1 {
        0%,100% { transform:translate(0,0); opacity:.3; }
        50% { transform:translate(25px,-30px); opacity:1; }
      }
      @keyframes p2 {
        0%,100% { transform:translate(0,0); opacity:.25; }
        50% { transform:translate(-20px,20px); opacity:.9; }
      }
      @keyframes p3 {
        0%,100% { transform:translate(0,0); opacity:.25; }
        50% { transform:translate(30px,15px); opacity:.8; }
      }
    </style>
  </defs>

  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="28" fill="url(#glow)"/>
  <rect width="1600" height="620" rx="28" fill="url(#grid)"/>

  <!-- Top navigation -->
  <rect x="35" y="28" width="1530" height="58" rx="20"
        fill="#081426" fill-opacity=".82"
        stroke="url(#border)"/>

  <circle cx="67" cy="57" r="16" fill="#0B2140" stroke="#22D3EE"/>
  <text x="58" y="63" font-family="monospace" font-size="18"
        font-weight="700" fill="#22D3EE">&gt;_</text>

  <text x="94" y="64" font-family="Arial,Helvetica,sans-serif"
        font-size="21" fill="#F8FAFC">Welcome to my GitHub Profile</text>

  <text x="1210" y="64" font-family="Arial,Helvetica,sans-serif"
        font-size="17" fill="#CBD5E1">AI</text>
  <circle cx="1240" cy="58" r="2.5" fill="#22D3EE"/>
  <text x="1258" y="64" font-family="Arial,Helvetica,sans-serif"
        font-size="17" fill="#CBD5E1">Data</text>
  <circle cx="1310" cy="58" r="2.5" fill="#22D3EE"/>
  <text x="1328" y="64" font-family="Arial,Helvetica,sans-serif"
        font-size="17" fill="#CBD5E1">Web</text>
  <circle cx="1380" cy="58" r="2.5" fill="#22D3EE"/>
  <text x="1398" y="64" font-family="Arial,Helvetica,sans-serif"
        font-size="17" fill="#CBD5E1">Open Source</text>

  <!-- Left hero -->
  <g class="fade">
    <text x="72" y="145" font-family="Arial,Helvetica,sans-serif"
          font-size="26" fill="#E2E8F0">Hi there 👋</text>

    <text x="72" y="205" font-family="Arial,Helvetica,sans-serif"
          font-size="66" font-weight="800" fill="url(#name)">I'm Dharmendra</text>

    <text x="72" y="273" font-family="Arial,Helvetica,sans-serif"
          font-size="66" font-weight="800" fill="#FFFFFF">Chilhate</text>

    <text x="74" y="322" font-family="Arial,Helvetica,sans-serif"
          font-size="31" font-weight="700" fill="#22D3EE">AI/ML Engineer</text>
    <text x="326" y="322" font-family="Arial,Helvetica,sans-serif"
          font-size="31" font-weight="700" fill="#A78BFA">|</text>
    <text x="347" y="322" font-family="Arial,Helvetica,sans-serif"
          font-size="31" font-weight="700" fill="#A78BFA">Full Stack Developer</text>

    <text x="74" y="360" font-family="Arial,Helvetica,sans-serif"
          font-size="18" fill="#CBD5E1">Final-year B.Tech AIML student passionate about</text>
    <text x="74" y="386" font-family="Arial,Helvetica,sans-serif"
          font-size="18" fill="#CBD5E1">building practical solutions with AI, Data and</text>
    <text x="74" y="412" font-family="Arial,Helvetica,sans-serif"
          font-size="18" fill="#CBD5E1">modern web technologies.</text>

    <rect x="72" y="434" width="150" height="40" rx="20"
          fill="#0A1D33" stroke="#2563EB"/>
    <circle cx="94" cy="454" r="7" fill="#A78BFA"/>
    <text x="111" y="460" font-family="Arial,Helvetica,sans-serif"
          font-size="15" fill="#E2E8F0">Bhopal, India</text>

    <rect x="232" y="434" width="205" height="40" rx="20"
          fill="#0A1D33" stroke="#22D3EE"/>
    <circle cx="255" cy="454" r="7" fill="#22D3EE" class="pulse"/>
    <text x="271" y="460" font-family="Arial,Helvetica,sans-serif"
          font-size="15" fill="#E2E8F0">Open to Opportunities</text>

    <g class="d2">
      <rect x="72" y="492" width="105" height="42" rx="12"
            fill="#09182A" stroke="#334155"/>
      <text x="91" y="519" font-family="Arial,Helvetica,sans-serif"
            font-size="15" font-weight="600" fill="#FFFFFF">GitHub</text>

      <rect x="187" y="492" width="112" height="42" rx="12"
            fill="#09182A" stroke="#2563EB"/>
      <text x="207" y="519" font-family="Arial,Helvetica,sans-serif"
            font-size="15" font-weight="600" fill="#FFFFFF">LinkedIn</text>

      <rect x="309" y="492" width="120" height="42" rx="12"
            fill="#09182A" stroke="#7C3AED"/>
      <text x="328" y="519" font-family="Arial,Helvetica,sans-serif"
            font-size="15" font-weight="600" fill="#FFFFFF">Portfolio</text>

      <rect x="439" y="492" width="105" height="42" rx="12"
            fill="#09182A" stroke="#22D3EE"/>
      <text x="461" y="519" font-family="Arial,Helvetica,sans-serif"
            font-size="15" font-weight="600" fill="#FFFFFF">Email</text>
    </g>
  </g>

  <!-- Photo -->
  <g class="fade d1">
    <circle cx="805" cy="340" r="225" fill="#22D3EE" opacity=".12" filter="url(#soft)"/>
    <circle cx="805" cy="340" r="215" fill="none"
            stroke="url(#border)" stroke-width="2"
            stroke-dasharray="10 15" class="spin"/>
    <circle cx="805" cy="340" r="230" fill="none"
            stroke="#22D3EE" stroke-width="1"
            stroke-dasharray="3 25" opacity=".35" class="spin2"/>

    <circle cx="805" cy="340" r="194" fill="#07111F" stroke="url(#border)" stroke-width="4"/>

    <!-- Keep dharmendra.jpg beside this SVG in /assets -->
    <image x="615" y="150" width="380" height="380"
           href="profile.png"
           xlink:href="profile.png"
           preserveAspectRatio="xMidYMid slice"
           clip-path="url(#photoClip)"/>

    <circle cx="805" cy="340" r="190" fill="none"
            stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>

    <circle cx="805" cy="108" r="7" fill="#22D3EE"
            filter="url(#glow)" class="pulse"/>

    <circle cx="1004" cy="340" r="6" fill="#A78BFA"
            filter="url(#glow)" class="pulse"/>
    <circle cx="805" cy="572" r="5" fill="#38BDF8" class="pulse"/>

    <g class="float">
      <text x="1010" y="230" font-family="cursive" font-size="28"
            font-weight="700" fill="#FFFFFF">Build</text>
      <text x="1018" y="265" font-family="cursive" font-size="28"
            font-weight="700" fill="#22D3EE">Learn</text>
      <text x="1010" y="300" font-family="cursive" font-size="28"
            font-weight="700" fill="#A78BFA">Grow</text>
      <text x="1002" y="335" font-family="cursive" font-size="28"
            font-weight="700" fill="#FFFFFF">Repeat!</text>
    </g>
  </g>

  <!-- Quote card -->
  <g class="fade d3">
    <rect x="1110" y="120" width="410" height="185" rx="25"
          fill="url(#card)" stroke="url(#border)" stroke-width="1.5"/>

    <text x="1140" y="178" font-family="Georgia,serif"
          font-size="75" font-weight="700" fill="#A78BFA" opacity=".75">“</text>

    <text x="1190" y="165" font-family="Arial,Helvetica,sans-serif"
          font-size="17" fill="#E2E8F0">Turning ideas into real-world</text>
    <text x="1190" y="192" font-family="Arial,Helvetica,sans-serif"
          font-size="17" fill="#E2E8F0">solutions using AI, Data and</text>
    <text x="1190" y="219" font-family="Arial,Helvetica,sans-serif"
          font-size="17" fill="#E2E8F0">Modern Web Technologies.</text>

    <text x="1245" y="264" font-family="cursive"
          font-size="18" font-style="italic" fill="#A78BFA">
      — Dharmendra Chilhate
    </text>
  </g>

  <!-- Right feature panel -->
  <g class="fade d4">
    <rect x="1110" y="330" width="410" height="205" rx="25"
          fill="#081426" fill-opacity=".92" stroke="#1E4D78"/>

    <g class="float">
      <circle cx="1170" cy="375" r="27" fill="#111D3A" stroke="#A78BFA"/>
      <text x="1153" y="384" font-family="monospace" font-size="24"
            font-weight="700" fill="#A78BFA">&lt;/&gt;</text>
      <text x="1140" y="423" font-family="Arial,Helvetica,sans-serif"
            font-size="13" fill="#E2E8F0">Code</text>
      <text x="1130" y="442" font-family="Arial,Helvetica,sans-serif"
            font-size="13" fill="#94A3B8">Innovate</text>
    </g>

    <g class="float" style="animation-delay:.6s">
      <circle cx="1265" cy="375" r="27" fill="#11283A" stroke="#22D3EE"/>
      <text x="1253" y="383" font-family="Arial,Helvetica,sans-serif"
            font-size="24" fill="#22D3EE">✦</text>
      <text x="1238" y="423" font-family="Arial,Helvetica,sans-serif"
            font-size="13" fill="#E2E8F0">Learn</text>
      <text x="1237" y="442" font-family="Arial,Helvetica,sans-serif"
            font-size="13" fill="#94A3B8">Grow</text>
    </g>

    <g class="float" style="animation-delay:1.1s">
      <circle cx="1360" cy="375" r="27" fill="#16213D" stroke="#60A5FA"/>
      <text x="1347" y="383" font-family="Arial,Helvetica,sans-serif"
            font-size="23" fill="#60A5FA">◆</text>
      <text x="1335" y="423" font-family="Arial,Helvetica,sans-serif"
            font-size="13" fill="#E2E8F0">Build</text>
      <text x="1335" y="442" font-family="Arial,Helvetica,sans-serif"
            font-size="13" fill="#94A3B8">Deploy</text>
    </g>

    <g class="float" style="animation-delay:1.7s">
      <circle cx="1455" cy="375" r="27" fill="#102C2A" stroke="#4ADE80"/>
      <circle cx="1455" cy="375" r="9" fill="none" stroke="#4ADE80" stroke-width="3"/>
      <text x="1419" y="423" font-family="Arial,Helvetica,sans-serif"
            font-size="13" fill="#E2E8F0">Open Source</text>
      <text x="1427" y="442" font-family="Arial,Helvetica,sans-serif"
            font-size="13" fill="#94A3B8">Contribute</text>
    </g>

    <rect x="1195" y="470" width="290" height="48" rx="24"
          fill="#07111F" stroke="#22D3EE"/>
    <circle cx="1220" cy="494" r="8" fill="#22C55E" class="pulse"/>
    <text x="1240" y="490" font-family="Arial,Helvetica,sans-serif"
          font-size="12" fill="#94A3B8">Currently Learning</text>
    <text x="1240" y="508" font-family="Arial,Helvetica,sans-serif"
          font-size="14" font-weight="700" fill="#E2E8F0">Cloud Services</text>
  </g>

  <!-- Particles -->
  <circle cx="580" cy="110" r="3" fill="#22D3EE" class="p1"/>
  <circle cx="550" cy="150" r="2" fill="#A78BFA" class="p2"/>
  <circle cx="1080" cy="100" r="3" fill="#60A5FA" class="p3"/>
  <circle cx="1040" cy="500" r="2" fill="#22D3EE" class="p1"/>
  <circle cx="570" cy="480" r="2" fill="#A78BFA" class="p2"/>

  <!-- Animated scan -->
  <rect x="0" y="100" width="1600" height="2"
        fill="#22D3EE" opacity=".18" class="scan"/>

  <!-- Bottom accent -->
  <path d="M0 585 C180 555 310 615 490 585 S800 555 1000 585 S1320 615 1600 570"
        fill="none" stroke="url(#border)" stroke-width="2" opacity=".55"/>

  <!-- Outer border -->
  <rect x="1.5" y="1.5" width="1597" height="617" rx="28"
        fill="none" stroke="url(#border)" stroke-width="2" opacity=".75"/>

</svg>
